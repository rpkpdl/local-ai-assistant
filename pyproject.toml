[project]
name = "local-ai-assistant"
version = "0.1.0"
description = "Local-first personal AI assistant with long-term memory, guarded web access and tracing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "arize-phoenix-otel>=0.17",
    "openinference-instrumentation-anthropic>=3.0",
]

[project.optional-dependencies]
# The Phoenix server itself, for running the trace UI locally (scripts/run_phoenix.sh).
# Docker uses the official Phoenix image instead.
phoenix = ["arize-phoenix>=20"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["assistant", "assistant.memory", "assistant.web"]

[tool.setuptools.package-data]
assistant = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".phoenix"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long lines are mostly prompt text and tool docstrings the model reads; wrapping them for
# a linter would change model input.
ignore = ["E501"]
