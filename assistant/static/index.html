<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Assistant</title>
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --surface-2: #f0efec; --border: #e3e1dc;
    --text: #1d1c1a; --muted: #6b6862; --accent: #c2410c; --accent-soft: #fdeee6;
    --user-bg: #1d1c1a; --user-text: #fafaf9; --ok: #15803d; --err: #b91c1c; --warn: #a16207;
    --code-bg: #f3f2ef; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614; --surface: #1f1e1c; --surface-2: #2a2926; --border: #34322f;
      --text: #ecebe8; --muted: #9c9891; --accent: #f97316; --accent-soft: #3a2417;
      --user-bg: #ecebe8; --user-text: #161614; --ok: #4ade80; --err: #f87171; --warn: #facc15;
      --code-bg: #2a2926; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* header */
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .pill { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
  .pill span { background: var(--surface-2); padding: 2px 8px; border-radius: 99px; }
  .spacer { flex: 1; }
  .btn {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 12px; font-size: 13px;
  }
  .btn:hover { border-color: var(--muted); }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); user-select: none; cursor: pointer; }
  .toggle input { display: none; }
  .track { width: 34px; height: 20px; border-radius: 99px; background: var(--border); position: relative; transition: background .15s; }
  .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .toggle input:checked + .track { background: var(--accent); }
  .toggle input:checked + .track::after { transform: translateX(14px); }

  /* layout */
  .layout { flex: 1; display: flex; min-height: 0; }
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; }
  .empty h2 { color: var(--text); font-weight: 600; font-size: 20px; margin: 0 0 6px; }

  .msg.user {
    align-self: flex-end; max-width: 80%; background: var(--user-bg); color: var(--user-text);
    padding: 9px 14px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.assistant { align-self: stretch; word-wrap: break-word; }
  .msg.assistant .body > :first-child { margin-top: 0; }
  .msg.assistant .body > :last-child { margin-bottom: 0; }
  .msg.assistant p { margin: 0 0 10px; }
  .msg.assistant ul, .msg.assistant ol { margin: 0 0 10px; padding-left: 22px; }
  .msg.assistant h1, .msg.assistant h2, .msg.assistant h3 { font-size: 16px; margin: 14px 0 6px; }
  .msg.assistant code { font-family: var(--mono); font-size: 13px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  .msg.assistant pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
  .msg.assistant pre code { background: none; padding: 0; }
  .msg.assistant a { color: var(--accent); }
  .msg.assistant table { border-collapse: collapse; margin: 0 0 10px; font-size: 14px; display: block; overflow-x: auto; }
  .msg.assistant th, .msg.assistant td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; }
  .status { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .dots span { display: inline-block; width: 5px; height: 5px; margin-right: 3px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  .notice { font-size: 13px; color: var(--muted); border-left: 3px solid var(--accent); padding: 4px 10px; margin: 6px 0 10px; background: var(--accent-soft); border-radius: 0 6px 6px 0; }
  .error { color: var(--err); font-size: 14px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }

  /* composer */
  .composer { padding: 12px 16px 16px; }
  .composer form {
    max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 8px 8px 8px 14px; box-shadow: var(--shadow);
  }
  .composer form:focus-within { border-color: var(--muted); }
  textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--text);
    font: inherit; max-height: 200px; padding: 6px 0;
  }
  .send { background: var(--accent); color: #fff; border: 0; border-radius: 9px; padding: 7px 14px; font-weight: 600; }
  .send:disabled { opacity: .45; cursor: default; }

  /* side panel */
  aside {
    width: 440px; border-left: 1px solid var(--border); background: var(--surface);
    display: none; flex-direction: column; min-height: 0;
  }
  body.verbose aside { display: flex; }
  .tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--border); }
  .tab { background: none; border: 0; padding: 7px 12px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .panel { flex: 1; overflow-y: auto; padding: 12px; display: none; font-size: 13px; }
  .panel.active { display: block; }
  .panel .hint { color: var(--muted); }
  .turn { margin-bottom: 16px; }
  .turn-head { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; margin-bottom: 6px; }
  .turn-head .q { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .turn-head .t { color: var(--muted); font-weight: 400; white-space: nowrap; }
  .ev { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; background: var(--bg); }
  .ev summary { list-style: none; cursor: pointer; padding: 6px 10px; display: flex; align-items: center; gap: 8px; }
  .ev summary::-webkit-details-marker { display: none; }
  .ev .kind { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
  .ev .kind.tool { background: var(--accent-soft); color: var(--accent); }
  .ev .kind.judge { background: var(--surface-2); color: var(--warn); }
  .totals { position: sticky; top: -12px; margin: -12px -12px 12px; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 1; }
  .totals .big { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .totals .split { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .turn-cost { color: var(--muted); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .ev .name { font-family: var(--mono); font-weight: 600; }
  .ev .right { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .ev .state.run { color: var(--warn); } .ev .state.ok { color: var(--ok); } .ev .state.err { color: var(--err); }
  .ev .detail { padding: 0 10px 10px; }
  .ev .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin: 6px 0 3px; }
  .ev pre { margin: 0; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; background: var(--code-bg); padding: 8px; border-radius: 6px; max-height: 260px; overflow-y: auto; }
  .ev.note { padding: 6px 10px; border-left: 3px solid var(--accent); }
  .ev.bad { padding: 6px 10px; border-left: 3px solid var(--err); color: var(--err); }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; background: var(--bg); }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 3px; word-break: break-all; }
  .card .tags { color: var(--accent); font-size: 12px; }

  @media (max-width: 900px) {
    aside { position: fixed; inset: 49px 0 0 auto; width: min(440px, 100vw); z-index: 5; box-shadow: -8px 0 24px rgba(0,0,0,.15); }
    .pill { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Assistant</h1>
  <div class="pill" id="pill"></div>
  <div class="spacer"></div>
  <button class="btn" id="newChat" title="Start a new conversation (memories are kept)">New chat</button>
  <label class="toggle" title="Show tool calls, API usage, memories and sources">
    <input type="checkbox" id="verbose"><span class="track"></span>Verbose
  </label>
</header>

<div class="layout">
  <main class="chat">
    <div id="messages"><div class="thread" id="thread">
      <div class="empty" id="empty"><h2>How can I help?</h2>Ask me anything. I remember things across sessions and can look things up on the web.</div>
    </div></div>
    <div class="composer">
      <form id="form">
        <textarea id="input" rows="1" placeholder="Message the assistant…" autofocus></textarea>
        <button class="send" id="send" type="submit">Send</button>
      </form>
    </div>
  </main>

  <aside>
    <div class="tabs">
      <button class="tab active" data-tab="activity">Activity</button>
      <button class="tab" data-tab="memories">Memories</button>
      <button class="tab" data-tab="sources">Sources</button>
    </div>
    <div class="panel active" id="activity">
      <div class="totals"><div class="split">This chat</div><div class="big" id="totalCost">$0.0000</div>
        <div class="split" id="totalSplit">agent $0.0000 · judge $0.0000 · 0 turns</div></div>
      <div id="turns"><p class="hint">Tool calls, API calls and costs for each turn appear here.</p></div>
    </div>
    <div class="panel" id="memories"></div>
    <div class="panel" id="sources"></div>
  </aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
const thread = $("thread"), scroller = $("messages"), input = $("input"), sendBtn = $("send");
let busy = false, turnNo = 0;
const totals = { agent: 0, judge: 0, memory: 0 };
const usd = (n) => `$${n.toFixed(4)}`;
function renderTotals() {
  $("totalCost").textContent = usd(totals.agent + totals.judge + totals.memory);
  $("totalSplit").textContent = `agent ${usd(totals.agent)} · judge ${usd(totals.judge)} · memory ${usd(totals.memory)} · ${turnNo} turn${turnNo === 1 ? "" : "s"}`;
}

// ---------- preferences ----------
function pref(key, fallback) { try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; } }
function savePref(key, value) { try { localStorage.setItem(key, value); } catch {} }
function setVerbose(on) {
  document.body.classList.toggle("verbose", on);
  $("verbose").checked = on;
  savePref("verbose", on ? "1" : "0");
  if (on) refreshSide();
}
$("verbose").addEventListener("change", (e) => setVerbose(e.target.checked));
setVerbose(pref("verbose", "0") === "1");

document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === t.dataset.tab));
  refreshSide();
}));

// ---------- tiny, safe markdown renderer (escapes all HTML first) ----------
function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`);
}
function markdown(src) {
  const lines = src.replace(/\r/g, "").split("\n");
  let html = "", i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; html += `<pre><code>${esc(buf.join("\n"))}</code></pre>`; continue;
    }
    if (/^#{1,3}\s/.test(line)) { const n = line.match(/^#+/)[0].length; html += `<h${n}>${inline(line.slice(n).trim())}</h${n}>`; i++; continue; }
    if (/^\s*[-*]\s+/.test(line)) {
      html += "<ul>"; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) html += `<li>${inline(lines[i++].replace(/^\s*[-*]\s+/, ""))}</li>`; html += "</ul>"; continue;
    }
    if (/^\s*\d+[.)]\s+/.test(line)) {
      html += "<ol>"; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) html += `<li>${inline(lines[i++].replace(/^\s*\d+[.)]\s+/, ""))}</li>`; html += "</ol>"; continue;
    }
    if (/^\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
      html += "<table><tr>" + cells(line).map((c) => `<th>${c}</th>`).join("") + "</tr>"; i += 2;
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) html += "<tr>" + cells(lines[i++]).map((c) => `<td>${c}</td>`).join("") + "</tr>";
      html += "</table>"; continue;
    }
    if (!line.trim()) { i++; continue; }
    // Always consume the current line, so text that only looks like a block start
    // (e.g. a table row whose |---| line hasn't streamed in yet) can't stall the loop
    const buf = [inline(lines[i++])];
    while (i < lines.length && lines[i].trim() && !/^(```|#{1,3}\s|\s*[-*]\s+|\s*\d+[.)]\s+|\|)/.test(lines[i])) buf.push(inline(lines[i++]));
    html += `<p>${buf.join("<br>")}</p>`;
  }
  return html;
}

// ---------- chat ----------
function nearBottom() { return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120; }
function scrollDown(force) { if (force || nearBottom()) scroller.scrollTop = scroller.scrollHeight; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function addUser(text) { $("empty")?.remove(); thread.append(el("div", "msg user", text)); scrollDown(true); }

function addAssistant() {
  const wrap = el("div", "msg assistant");
  const body = el("div", "body"), status = el("div", "status");
  status.innerHTML = '<span class="dots"><span></span><span></span><span></span></span><span class="what">Thinking…</span>';
  wrap.append(body, status); thread.append(wrap); scrollDown(true);
  return { wrap, body, status, text: "" };
}

async function send(text) {
  busy = true; sendBtn.disabled = true;
  addUser(text);
  const a = addAssistant();
  const log = startTurnLog(text);
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }),
    });
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (line.trim()) handle(JSON.parse(line), a, log);
      }
    }
  } catch (err) {
    a.body.append(el("div", "error", `Request failed: ${err.message}`));
  } finally {
    a.status.remove();
    busy = false; sendBtn.disabled = false; input.focus();
    if (document.body.classList.contains("verbose")) refreshSide();
  }
}

function handle(ev, a, log) {
  switch (ev.type) {
    case "text_start":
      if (a.text && !a.text.endsWith("\n\n")) a.text += "\n\n";
      break;
    case "text":
      a.text += ev.delta; a.body.innerHTML = markdown(a.text);
      a.status.querySelector(".what").textContent = "Writing…";
      scrollDown();
      break;
    case "tool_start":
      a.status.querySelector(".what").textContent = `Using ${ev.name}…`;
      log.toolStart(ev); break;
    case "tool_end": log.toolEnd(ev); break;
    case "llm":
      log.llm(ev);
      if (ev.role === "agent" && ev.stop_reason === "end_turn") a.status.querySelector(".what").textContent = "Updating memory…";
      break;
    case "notice":
      a.body.append(el("div", "notice", ev.text)); log.note(ev.text); break;
    case "memory": {
      const label = { saved: "Remembered", updated: "Updated memory", linked: "Remembered" }[ev.action] || "Memory";
      a.body.append(el("div", "notice", `${label}: ${ev.text}`)); log.note(`memory ${ev.action} (${ev.id}): ${ev.text}`);
      break;
    }
    case "error":
      a.body.append(el("div", "error", ev.message)); log.bad(ev.message); break;
    case "done":
      log.done(ev);
      if (document.body.classList.contains("verbose")) a.wrap.append(el("div", "meta",
        `${(ev.ms / 1000).toFixed(1)} s · ${usd(ev.cost)}` + (ev.judge_cost || ev.memory_cost ? ` (agent ${usd(ev.agent_cost)} + judge ${usd(ev.judge_cost)} + memory ${usd(ev.memory_cost || 0)})` : "")));
      break;
  }
}

// ---------- activity log (right panel) ----------
function pretty(v) {
  if (typeof v !== "string") return JSON.stringify(v, null, 2);
  try { return JSON.stringify(JSON.parse(v), null, 2); } catch { return v; }
}
function startTurnLog(text) {
  const panel = $("activity"), turns = $("turns");
  turns.querySelector(".hint")?.remove();
  const turn = el("div", "turn"), head = el("div", "turn-head");
  const q = el("span", "q", `#${++turnNo} ${text}`), t = el("span", "t", "running…");
  head.append(q, t); turn.append(head); turns.append(turn);
  panel.scrollTop = panel.scrollHeight;
  const tools = {};
  const add = (node) => { turn.append(node); panel.scrollTop = panel.scrollHeight; };
  return {
    toolStart(ev) {
      const d = el("details", "ev");
      const s = el("summary"); s.append(el("span", "kind tool", "tool"), el("span", "name", ev.name));
      const r = el("span", "right"), st = el("span", "state run", "running"); r.append(st); s.append(r);
      const detail = el("div", "detail");
      detail.append(el("div", "label", "input"), el("pre", null, pretty(ev.input)));
      d.append(s, detail); add(d); tools[ev.id] = { d, r, st, detail };
    },
    toolEnd(ev) {
      const t = tools[ev.id]; if (!t) return;
      t.st.className = "state " + (ev.error ? "err" : "ok"); t.st.textContent = ev.error ? "error" : "ok";
      t.r.prepend(`${ev.ms} ms · `);
      t.detail.append(el("div", "label", "output"), el("pre", null, pretty(ev.output)));
    },
    llm(ev) {
      const d = el("details", "ev"), s = el("summary");
      const side = ev.role === "judge" || ev.role === "memory";
      s.append(el("span", side ? "kind judge" : "kind", side ? ev.role : "llm"), el("span", "name", ev.model));
      s.append(el("span", "right", `${ev.input_tokens.toLocaleString()} in · ${ev.output_tokens.toLocaleString()} out · ${ev.ms} ms` + (ev.cost != null ? ` · $${ev.cost.toFixed(4)}` : "")));
      const detail = el("div", "detail");
      detail.append(el("pre", null, `stop_reason: ${ev.stop_reason}\ncache read: ${ev.cache_read_tokens}\ncache write: ${ev.cache_write_tokens}`));
      d.append(s, detail); add(d);
    },
    note(text) { add(el("div", "ev note", text)); },
    bad(text) { add(el("div", "ev bad", text)); },
    done(ev) {
      t.textContent = `${(ev.ms / 1000).toFixed(1)} s · ${usd(ev.cost)}`;
      add(el("div", "turn-cost", `agent ${usd(ev.agent_cost)} + judge ${usd(ev.judge_cost)} + memory ${usd(ev.memory_cost || 0)} = ${usd(ev.cost)}`));
      totals.agent += ev.agent_cost; totals.judge += ev.judge_cost; totals.memory += ev.memory_cost || 0; renderTotals();
    },
  };
}

// ---------- memories / sources tabs ----------
async function refreshSide() {
  const active = document.querySelector(".tab.active").dataset.tab;
  if (active === "memories") {
    const list = await (await fetch("/api/memories")).json(), p = $("memories");
    p.replaceChildren();
    if (!list.length) p.append(el("p", "hint", "No memories yet."));
    for (const m of list.slice().reverse()) {
      const c = el("div", "card"); c.append(el("div", null, m.content));
      const kind = m.kind + (m.attribute ? `:${m.attribute}` : "") + (m.entity ? ` · ${m.entity}` : "");
      const sub = el("div", "sub", `${m.id} · ${kind} · ${m.salience.toFixed(2)} · ${new Date(m.created_at * 1000).toLocaleDateString()} `);
      if (m.tags.length) sub.append(el("span", "tags", m.tags.join(", ")));
      c.append(sub); p.append(c);
    }
  } else if (active === "sources") {
    const list = await (await fetch("/api/sources")).json(), p = $("sources");
    p.replaceChildren();
    if (!list.length) p.append(el("p", "hint", "No cached sources yet."));
    for (const s of list) {
      const c = el("div", "card"); c.append(el("strong", null, `#${s.id} ${s.task}`));
      c.append(el("div", "sub", s.url_template));
      c.append(el("div", "sub", `ok ${s.successes} · failed ${s.failures}` + (s.consecutive_failures >= 3 ? " · disabled" : "")));
      if (s.check) c.append(el("div", "sub", `check: ${s.check}`));
      p.append(c);
    }
  }
}

// ---------- composer & header ----------
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = ""; autosize(); send(text);
});
$("newChat").addEventListener("click", async () => {
  if (busy) return;
  await fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  thread.replaceChildren(el("div", "empty"));
  thread.firstChild.id = "empty";
  thread.firstChild.innerHTML = "<h2>New conversation</h2>Memories and sources are kept.";
  $("turns").replaceChildren(el("p", "hint", "Tool calls, API calls and costs for each turn appear here."));
  turnNo = 0; totals.agent = 0; totals.judge = 0; totals.memory = 0; renderTotals(); input.focus();
});

fetch("/api/state").then((r) => r.json()).then((s) => {
  const p = $("pill");
  p.append(el("span", null, `${s.model} · ${s.effort}`));
  p.append(el("span", null, s.search ? "web search on" : "web search off"));
  p.append(el("span", null, s.tracing ? "tracing on" : "tracing off"));
});
</script>
</body>
