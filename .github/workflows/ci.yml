name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: touch .env && docker compose config --quiet
      - name: Build image
        run: docker build -t local-ai-assistant .
      - name: Smoke test
        run: |
          docker run -d --name app -e ANTHROPIC_API_KEY=test-key -p 127.0.0.1:8000:8000 local-ai-assistant
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/state
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:8000/)" = 400
